openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: SEMBER CONNECT API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: organizations
  - name: opportunities
  - name: professionals
  - name: applications
  - name: stats
  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Credenciales inválidas
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Registrar cuenta (postulante o empresa)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Cuenta creada, código OTP enviado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResult"
        "409":
          description: El correo ya está registrado
  /auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [auth]
      summary: Verificar correo con código OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailInput"
      responses:
        "200":
          description: Correo verificado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyEmailResult"
        "400":
          description: Código inválido o expirado
  /auth/resend-otp:
    post:
      operationId: resendOtp
      tags: [auth]
      summary: Reenviar código OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendOtpInput"
      responses:
        "200":
          description: Código reenviado (si corresponde)
        "429":
          description: Espera antes de reenviar
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Cerrar sesión
      responses:
        "204":
          description: Sesión cerrada
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Usuario actual
      responses:
        "200":
          description: Usuario autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: No autenticado
    patch:
      operationId: updatePreferences
      tags: [auth]
      summary: Actualizar preferencias del usuario actual
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePreferencesInput"
      responses:
        "200":
          description: Preferencias actualizadas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: No autenticado
  /organizations:
    get:
      operationId: listOrganizations
      tags: [organizations]
      summary: List organizations
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organization"
    post:
      operationId: createOrganization
      tags: [organizations]
      summary: Register an organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
  /organizations/{id}:
    get:
      operationId: getOrganization
      tags: [organizations]
      summary: Get organization
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "404":
          description: Not found
    patch:
      operationId: updateOrganization
      tags: [organizations]
      summary: Update organization
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
    delete:
      operationId: deleteOrganization
      tags: [organizations]
      summary: Delete organization
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
  /opportunities:
    get:
      operationId: listOpportunities
      tags: [opportunities]
      summary: Search opportunities
      parameters:
        - name: type
          in: query
          schema: { type: string }
        - name: country
          in: query
          schema: { type: string }
        - name: city
          in: query
          schema: { type: string }
        - name: modality
          in: query
          schema: { type: string }
        - name: area
          in: query
          schema: { type: string }
        - name: organizationId
          in: query
          schema: { type: integer }
        - name: status
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Opportunities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Opportunity"
    post:
      operationId: createOpportunity
      tags: [opportunities]
      summary: Publish an opportunity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpportunityInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"
  /opportunities/{id}:
    get:
      operationId: getOpportunity
      tags: [opportunities]
      summary: Get opportunity detail (increments view count)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Opportunity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"
        "404":
          description: Not found
    patch:
      operationId: updateOpportunity
      tags: [opportunities]
      summary: Update opportunity
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpportunityUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"
    delete:
      operationId: deleteOpportunity
      tags: [opportunities]
      summary: Delete opportunity
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
  /professionals:
    get:
      operationId: listProfessionals
      tags: [professionals]
      summary: List professionals
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: country
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Professionals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Professional"
    post:
      operationId: createProfessional
      tags: [professionals]
      summary: Create professional profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfessionalInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Professional"
  /professionals/{id}:
    get:
      operationId: getProfessional
      tags: [professionals]
      summary: Get professional profile
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Professional
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Professional"
        "404":
          description: Not found
    patch:
      operationId: updateProfessional
      tags: [professionals]
      summary: Update professional profile
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfessionalUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Professional"
  /professionals/{id}/saved:
    get:
      operationId: listSavedOpportunities
      tags: [professionals]
      summary: List saved opportunities for a professional
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Saved opportunities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Opportunity"
    post:
      operationId: saveOpportunity
      tags: [professionals]
      summary: Save an opportunity
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedOpportunityInput"
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedOpportunity"
  /professionals/{id}/saved/{opportunityId}:
    delete:
      operationId: unsaveOpportunity
      tags: [professionals]
      summary: Remove a saved opportunity
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: opportunityId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Removed
  /professionals/{id}/following:
    get:
      operationId: listFollowedOrganizations
      tags: [professionals]
      summary: List organizations followed by a professional
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Followed organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organization"
    post:
      operationId: followOrganization
      tags: [professionals]
      summary: Follow an organization
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FollowOrganizationInput"
      responses:
        "201":
          description: Following
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowOrganization"
  /professionals/{id}/following/{organizationId}:
    delete:
      operationId: unfollowOrganization
      tags: [professionals]
      summary: Unfollow an organization
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: organizationId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Removed
  /applications:
    get:
      operationId: listApplications
      tags: [applications]
      summary: List applications
      parameters:
        - name: opportunityId
          in: query
          schema: { type: integer }
        - name: professionalId
          in: query
          schema: { type: integer }
        - name: organizationId
          in: query
          schema: { type: integer }
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Application"
    post:
      operationId: createApplication
      tags: [applications]
      summary: Apply to an opportunity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "409":
          description: Already applied
  /applications/{id}:
    patch:
      operationId: updateApplication
      tags: [applications]
      summary: Update application status
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
  /stats/global:
    get:
      operationId: getGlobalStats
      tags: [stats]
      summary: Global executive dashboard stats (SEMBER)
      responses:
        "200":
          description: Global stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlobalStats"
  /stats/organizations/{id}:
    get:
      operationId: getOrganizationStats
      tags: [stats]
      summary: Institutional dashboard stats
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Organization stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationStats"
  /activity/recent:
    get:
      operationId: getRecentActivity
      tags: [stats]
      summary: Recent platform activity feed
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      description: |
        Unconditionally public — no authentication or ACL checks.
        Searches PUBLIC_OBJECT_SEARCH_PATHS for the given file path.
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
          description: Relative file path within the public search paths.
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve public object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      description: |
        Serves object entities uploaded via presigned URLs. These can optionally
        be protected with authentication or ACL checks based on the use case.
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: Object path within the private object dir (e.g. `uploads/some-uuid`).
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }
    RegisterInput:
      type: object
      required: [role, name, email, password]
      properties:
        role: { type: string, enum: [postulante, empresa] }
        name: { type: string, minLength: 2 }
        email: { type: string, minLength: 3 }
        password: { type: string, minLength: 8 }
        preferredLanguage: { type: string, enum: [es, en, pt] }
        organization:
          $ref: "#/components/schemas/OrganizationInput"
    RegisterResult:
      type: object
      required: [email, emailSent]
      properties:
        email: { type: string }
        emailSent: { type: boolean }
    VerifyEmailInput:
      type: object
      required: [email, code]
      properties:
        email: { type: string, minLength: 1 }
        code: { type: string, minLength: 6, maxLength: 6 }
    VerifyEmailResult:
      type: object
      required: [verified, role]
      properties:
        verified: { type: boolean }
        role: { type: string }
    ResendOtpInput:
      type: object
      required: [email]
      properties:
        email: { type: string, minLength: 1 }
    AuthUser:
      type: object
      required: [id, email, role, name, preferredLanguage]
      properties:
        id: { type: integer }
        email: { type: string }
        role: { type: string, description: "postulante | empresa | admin" }
        name: { type: string }
        professionalId: { type: ["integer", "null"] }
        organizationId: { type: ["integer", "null"] }
        preferredLanguage: { type: string, enum: [es, en, pt] }
    UpdatePreferencesInput:
      type: object
      required: [preferredLanguage]
      properties:
        preferredLanguage: { type: string, enum: [es, en, pt] }
    Organization:
      type: object
      required: [id, name, type, country, status, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        type: { type: string, description: "universidad | empresa | gobierno | ong | fundacion | organismo_internacional" }
        country: { type: string }
        city: { type: ["string", "null"] }
        website: { type: ["string", "null"] }
        logoUrl: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        contactEmail: { type: ["string", "null"] }
        status: { type: string, description: "pendiente | aprobada | rechazada" }
        followersCount: { type: ["integer", "null"] }
        createdAt: { type: string }
    OrganizationInput:
      type: object
      required: [name, type, country]
      properties:
        name: { type: string, minLength: 1 }
        type: { type: string }
        country: { type: string }
        city: { type: string }
        website: { type: string }
        logoUrl: { type: string }
        description: { type: string }
        contactEmail: { type: string }
    OrganizationUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        type: { type: string }
        country: { type: string }
        city: { type: string }
        website: { type: string }
        logoUrl: { type: string }
        description: { type: string }
        contactEmail: { type: string }
        status: { type: string }
    Opportunity:
      type: object
      required: [id, organizationId, title, type, country, modality, status, createdAt]
      properties:
        id: { type: integer }
        organizationId: { type: integer }
        organizationName: { type: ["string", "null"] }
        title: { type: string }
        type: { type: string, description: "internship | empleo | beca | bootcamp | evento | movilidad | convocatoria" }
        area: { type: ["string", "null"] }
        country: { type: string }
        city: { type: ["string", "null"] }
        modality: { type: string, description: "presencial | remoto | hibrido" }
        paid: { type: ["boolean", "null"] }
        deadline: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        requirements: { type: ["string", "null"] }
        competencies:
          type: array
          items: { type: string }
        benefits: { type: ["string", "null"] }
        requiredDocuments:
          type: array
          items: { type: string }
        externalLink: { type: ["string", "null"] }
        language: { type: ["string", "null"] }
        status: { type: string, description: "activa | cerrada | borrador" }
        views: { type: integer }
        applicationsCount: { type: ["integer", "null"] }
        createdAt: { type: string }
    OpportunityInput:
      type: object
      required: [organizationId, title, type, country, modality]
      properties:
        organizationId: { type: integer }
        title: { type: string, minLength: 1 }
        type: { type: string }
        area: { type: string }
        country: { type: string }
        city: { type: string }
        modality: { type: string }
        paid: { type: boolean }
        deadline: { type: string }
        description: { type: string }
        requirements: { type: string }
        competencies:
          type: array
          items: { type: string }
        benefits: { type: string }
        requiredDocuments:
          type: array
          items: { type: string }
        externalLink: { type: string }
        language: { type: string }
        status: { type: string }
    OpportunityUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        type: { type: string }
        area: { type: string }
        country: { type: string }
        city: { type: string }
        modality: { type: string }
        paid: { type: boolean }
        deadline: { type: string }
        description: { type: string }
        requirements: { type: string }
        competencies:
          type: array
          items: { type: string }
        benefits: { type: string }
        requiredDocuments:
          type: array
          items: { type: string }
        externalLink: { type: string }
        language: { type: string }
        status: { type: string }
    Professional:
      type: object
      required: [id, name, email, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        headline: { type: ["string", "null"] }
        country: { type: ["string", "null"] }
        city: { type: ["string", "null"] }
        bio: { type: ["string", "null"] }
        languages:
          type: array
          items: { type: string }
        skills:
          type: array
          items: { type: string }
        education: { type: ["string", "null"] }
        experience: { type: ["string", "null"] }
        certifications:
          type: array
          items: { type: string }
        internationalAvailability: { type: ["boolean", "null"] }
        countriesOfInterest:
          type: array
          items: { type: string }
        preferredModality: { type: ["string", "null"] }
        avatarUrl: { type: ["string", "null"] }
        instagram: { type: ["string", "null"] }
        linkedin: { type: ["string", "null"] }
        x: { type: ["string", "null"] }
